<script>/* langue auto : avant le 1er affichage, evite le clignotement */
(function(){var S={fr:1,ht:1,en:1,es:1},d=document.documentElement,
s=null;try{s=localStorage.getItem("atmart_lang")}catch(e){}
var l=s&&S[s]?s:null;
if(!l){var n=navigator.languages||[navigator.language||""];
for(var i=0;i<n.length;i++){var c=String(n[i]).toLowerCase().split("-")[0];
if(c==="ht"||c==="hat"){l="ht";break}if(S[c]){l=c;break}}}

  <style>
    .badge { display:inline-block; font-size:0.72rem; font-weight:700; letter-spacing:0.08em;
             text-transform:uppercase; padding:0.22rem 0.6rem; border-radius:999px; white-space:nowrap; }
    .badge.prep { border:1px dashed rgba(244,162,97,0.65); color:#f4a261; }
    .badge.devis { border:1px solid rgba(46,196,182,0.55); color:var(--teal); }
    .badge.ok { border:1px solid rgba(46,196,182,0.55); background:rgba(46,196,182,0.12); color:var(--teal); }
    .fig video { width:100%; display:block; }
    /* Aucun mouvement impose : la boucle ne demarre jamais seule, et l'utilisateur
       qui a demande moins d'animation ne la voit pas bouger du tout. */
    @media (prefers-reduced-motion: reduce) { .fig video { animation:none !important; } }
    .fig { margin:0; border-radius:16px; overflow:hidden; border:1px solid rgba(255,255,255,0.09); background:#0a1421; }
    .fig img { width:100%; display:block; user-select:none; -webkit-user-drag:none; }
    .fig figcaption { padding:0.7rem 1rem 0.9rem; font-size:0.8rem; color:var(--ink-dim); display:flex;
                      gap:0.6rem; align-items:center; flex-wrap:wrap; }
    .gouv { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:0.6rem; }
    .gouv div { display:flex; justify-content:space-between; align-items:center; gap:0.8rem;

                border-radius:10px; padding:0.6rem 0.85rem; font-size:0.88rem; }
    .prod { background:rgba(255,255,255,0.035); border:1px solid rgba(255,255,255,0.1);
            border-radius:14px; overflow:hidden; display:flex; flex-direction:column; }
    .prod img { width:100%; display:block; }
    .prod .in { padding:1rem 1.1rem 1.2rem; display:flex; flex-direction:column; gap:0.4rem; flex:1; }
    .prod h4 { color:#fff; font-size:1.02rem; margin:0; font-family:var(--font-head); }
    .prod .sku { font-size:0.72rem; color:var(--ink-dim); font-family:monospace; word-break:break-all; }
    .prod p { color:var(--ink-dim); font-size:0.85rem; margin:0; }
    .prods { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:1rem; margin-top:1.2rem; }
    .pal-row { display:flex; gap:0.6rem; flex-wrap:wrap; margin-top:0.8rem; }
    .pal-row span { display:flex; align-items:center; gap:0.45rem; font-size:0.82rem; color:var(--ink-dim); }
    .pal-row i { width:22px; height:22px; border-radius:6px; border:1px solid rgba(255,255,255,0.15); display:block; }
    .chips { display:flex; gap:0.45rem; flex-wrap:wrap; }
    .chips span { font-size:0.8rem; padding:0.28rem 0.7rem; border-radius:999px;
                  border:1px solid rgba(255,255,255,0.16); color:var(--ink-dim); }
    .verite { background:rgba(244,162,97,0.07); border:1px solid rgba(244,162,97,0.32);

<script>
(function () {
  "use strict";
  Object.assign(ATM.S, {
    "fi.load": { fr: "Chargement de la fiche…", ht: "N ap chaje fich la…", en: "Loading the sheet…", es: "Cargando la ficha…" },
    "fi.404": { fr: "Fiche introuvable.", ht: "Nou pa jwenn fich sa a.", en: "Sheet not found.", es: "Ficha no encontrada." },
    "fi.k": { fr: "Fiche d'œuvre", ht: "Fich zèv la", en: "Artwork sheet", es: "Ficha de obra" },
    "fi.src": { fr: "Œuvre-source", ht: "Zèv sous la", en: "Source work", es: "Obra fuente" },
    "fi.srcn": { fr: "Visuel de référence. La validation ATM de l'œuvre-source est en préparation.", ht: "Se yon vizyèl referans. Validasyon ATM pou zèv sous la ap prepare.", en: "Reference visual. ATM validation of the source work is in preparation.", es: "Visual de referencia. La validación ATM de la obra fuente está en preparación." },
    "fi.hist": { fr: "L'histoire", ht: "Istwa a", en: "The story", es: "La historia" },
    "fi.insp": { fr: "L'inspiration", ht: "Enspirasyon an", en: "The inspiration", es: "La inspiración" },
    "fi.pal": { fr: "Palette", ht: "Koulè yo", en: "Palette", es: "Paleta" },
    "fi.pub": { fr: "Publics recommandés", ht: "Ki moun li bon pou yo", en: "Recommended audiences", es: "Públicos recomendados" },
    "fi.gouv": { fr: "Gouvernance et validations", ht: "Gouvènans ak validasyon", en: "Governance and validations", es: "Gobernanza y validaciones" },
    "fi.gouvn": { fr: "Rien n'est présenté comme disponible, testé ou tarifé tant que ce n'est pas validé. C'est la règle du dossier, et elle s'applique à cette page.", ht: "Nou pa prezante anyen kòm disponib, teste oswa tarife toutotan li poko valide. Se règ dosye a, epi li aplike sou paj sa a.", en: "Nothing is presented as available, tested or priced until it is validated. That is the rule of the file, and it applies to this page.", es: "Nada se presenta como disponible, probado o tarifado mientras no esté validado. Es la regla del expediente y se aplica a esta página." },
    "fi.proc": { fr: "Procédé de création", ht: "Kijan zèv la fèt", en: "Creation process", es: "Proceso de creación" },
    "fi.procn": { fr: "ATM+ Art indique avec transparence le procédé utilisé pour chaque création.", ht: "ATM+ Art di klè kijan chak kreyasyon fèt.", en: "ATM+ Art states transparently the process used for each creation.", es: "ATM+ Art indica con transparencia el proceso usado en cada creación." },
    "fi.procl": { fr: "Notre processus de création →", ht: "Kijan nou travay →", en: "Our creation process →", es: "Nuestro proceso de creación →" },
    "fi.gam": { fr: "Les trois gammes", ht: "Twa gam yo", en: "The three ranges", es: "Las tres gamas" },
    "fi.b2b": { fr: "Présentation B2B", ht: "Prezantasyon B2B", en: "B2B presentation", es: "Presentación B2B" },
    "fi.b2bn": { fr: "Règles de langage tenues face aux partenaires", ht: "Règ langaj nou kenbe devan patnè yo", en: "Language rules held with partners", es: "Reglas de lenguaje ante los socios" },
    "fi.voix": { fr: "Voix et mouvement", ht: "Vwa ak mouvman", en: "Voice and movement", es: "Voz y movimiento" },
    "fi.dia": { fr: "Variante de campagne diaspora", ht: "Vèsyon kanpay dyaspora", en: "Diaspora campaign variant", es: "Variante de campaña diáspora" },
    "fi.lic": { fr: "Licences et droits", ht: "Lisans ak dwa", en: "Licences and rights", es: "Licencias y derechos" },
    "fi.res": { fr: "Restrictions permanentes", ht: "Restriksyon ki pa janm chanje", en: "Permanent restrictions", es: "Restricciones permanentes" },
    "fi.act": { fr: "Ce que vous pouvez faire aujourd'hui", ht: "Sa ou ka fè jodi a", en: "What you can do today", es: "Lo que puede hacer hoy" },
    "fi.actn": { fr: "Ces deux actions fonctionnent réellement. Tout le reste — panier, paiement, livraison, écoute — n'apparaîtra que le jour où il existera.", ht: "De aksyon sa yo mache toutbon. Tout rès la — panye, peman, livrezon, koute — p ap parèt toutotan yo poko egziste.", en: "These two actions really work. Everything else — cart, payment, delivery, listening — will only appear the day it exists.", es: "Estas dos acciones funcionan de verdad. Todo lo demás —carrito, pago, envío, escucha— solo aparecerá el día que exista." },
    "fi.b1": { fr: "Être informé de l'ouverture", ht: "Fè m konnen lè l ap louvri", en: "Be told when it opens", es: "Avisarme de la apertura" },
    "fi.b2": { fr: "Demander un devis", ht: "Mande yon devi", en: "Request a quote", es: "Solicitar presupuesto" },
    "fi.back": { fr: "← La collection", ht: "← Koleksyon an", en: "← The collection", es: "← La colección" },
    "fi.dya": { fr: "Diaspora", ht: "Dyaspora", en: "Diaspora", es: "Diáspora" },
    "nv.col": { fr: "La collection", ht: "Koleksyon an", en: "The collection", es: "La colección" }
  });

  // Sur la page canonique /oeuvres/<slug>, le slug est fige dans le HTML.
  var id = window.ATM_SLUG || new URLSearchParams(location.search).get("o") || "table-ancetres";
  var F = null;

  /* Adresse historique : elle reste fonctionnelle mais renvoie vers l'URL
     canonique des que la fiche en declare une. GitHub Pages ne permet pas de
     301 cote serveur — c'est donc une redirection cote client, sans etape
     visible dans l'historique (replace). En local, le serveur de test ne sert
     pas les URL sans extension : on vise le .html. */
  function canonRedirect() {
    if (window.ATM_FICHE_CANON || !F || !F.url) return false;
    var p = F.url.replace(/^https?:\/\/[^/]+/, "");
    if (location.hostname === "localhost" || location.hostname === "127.0.0.1") p += ".html";
    location.replace(p);
    return true;
  }

  function V(x) { return ATM.V(x); }
  function badge(v) { return '<span class="badge ' + v + '">' + V(F.st[v]) + "</span>"; }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

  function sect(inner, pt) {
    return '<section style="padding-top:' + (pt || 0) + '"><div class="art-wide">' + inner + "</div></section>";
  }
  function head(k, h) {
    return '<p class="art-lbl">' + ATM.T(k) + "</p>" + (h ? '<h2 class="art-h">' + h + "</h2>" : "");
  }

  function render() {
    if (!F) {
      document.getElementById("fiche").innerHTML = sect('<p class="art-sub">' + ATM.T("fi.404") + "</p>", "2rem");
      return;
    }
    var d = ATM.ROOT + F.dir, h = [];

    h.push(sect(
      '<p><a href="atelier-collection.html" style="color:#9fb3c8;font-size:0.9rem">' + ATM.T("fi.back") + "</a></p>" +
      '<p class="art-lbl" style="margin-top:1rem">' + ATM.T("fi.k") + " · " + esc(F.uid) + "</p>" +
      '<h1 class="art-h" style="font-size:clamp(1.9rem,4.5vw,2.9rem)">' + V(F.t) + "</h1>" +
      '<p class="art-sub" style="font-size:1.05rem">' + V(F.accroche) + "</p>" +
      '<div class="chips" style="margin-top:1rem">' +
        F.gouvernance.slice(0, 3).map(function (g) {
          return "<span>" + V(g.k) + " · " + V(F.st[g.v]) + "</span>";
        }).join("") + "</div>", "2rem"));

    h.push(sect('<figure class="fig"><img src="' + d + 'source.jpg" alt="' + esc(V(F.resume)) +
      '" data-full="' + d + 'source.jpg" style="cursor:zoom-in" />' +
      "<figcaption>" + badge("prep") + "<span>" + ATM.T("fi.src") + " — " + ATM.T("fi.srcn") + "</span></figcaption></figure>", "1.5rem"));

    h.push(sect(head("fi.hist") + '<p class="work-story" style="max-width:75ch">' + V(F.histoire) + "</p>" +
      '<p class="art-lbl" style="margin-top:1.4rem">' + ATM.T("fi.insp") + "</p>" +
      '<p class="art-sub" style="max-width:75ch">' + V(F.inspiration) + "</p>" +
      '<p class="art-lbl" style="margin-top:1.4rem">' + ATM.T("fi.pal") + '</p><div class="pal-row">' +
      F.palette.map(function (p) {
        return '<span><i style="background:' + p.h + '"></i>' + V(p.t) + "</span>";
      }).join("") + "</div>" +
      '<p class="art-lbl" style="margin-top:1.4rem">' + ATM.T("fi.pub") + '</p><div class="chips">' +
      F.publics.map(function (p) { return "<span>" + V(p) + "</span>"; }).join("") + "</div>", "2.5rem"));

    h.push(sect(head("fi.gouv") + '<div class="gouv" style="margin-top:1rem">' +
      F.gouvernance.map(function (g) {
        return "<div><span>" + V(g.k) + "</span>" + badge(g.v) + "</div>";
      }).join("") + '</div><p class="art-note" style="margin-top:1rem;max-width:80ch">' +
      ATM.T("fi.gouvn") + "</p>", "2.5rem"));

    if (F.procede) {
      h.push(sect(head("fi.proc") +
        '<p class="art-sub" style="max-width:78ch;color:#cfdcea">' + V(F.procede_resume) + "</p>" +
        '<div class="gouv" style="margin-top:1.2rem">' + F.procede.map(function (p) {
          var val = (p.v === "prep" || p.v === "devis") ? badge(p.v) : "<span>" + V(p.v) + "</span>";
          return '<div><span style="color:var(--ink-dim)">' + V(p.k) + "</span>" + val + "</div>";
        }).join("") + "</div>" +
        '<p class="art-note" style="margin-top:1rem;max-width:80ch">' + ATM.T("fi.procn") +
        ' <a href="' + ATM.ROOT + 'processus-creation.html">' + ATM.T("fi.procl") + "</a></p>", "2.5rem"));
    }

    h.push(sect(head("fi.gam") + F.gammes.map(function (g) {
      return '<div style="margin-top:2rem"><h3 style="color:#fff;font-size:1.25rem;display:flex;gap:0.7rem;align-items:center;flex-wrap:wrap">' +
        V(g.t) + badge(g.v) + '</h3><p class="art-sub" style="max-width:75ch">' + V(g.p) + "</p>" +
        '<div class="prods">' + g.prods.map(function (p) {
          return '<div class="prod">' + (p.img ? '<img src="' + d + p.img + '" alt="' + esc(V(p.t)) +
            '" loading="lazy" data-full="' + d + p.img + '" style="cursor:zoom-in" />' : "") +
            '<div class="in"><h4>' + V(p.t) + "</h4>" + badge(p.v) +
            '<span class="sku">' + esc(p.sku) + "</span>" +
            (p.n ? "<p>" + V(p.n) + "</p>" : "") + "</div></div>";
        }).join("") + "</div></div>";
    }).join(""), "2.5rem"));

    h.push(sect('<div class="strip"><div class="s-media"><figure class="fig"><img src="' + d + F.b2b.img +
      '" alt="' + esc(ATM.T("fi.b2b")) + '" loading="lazy" /></figure></div><div>' +
      head("fi.b2b") + '<ul class="s-list">' + F.b2b.ben.map(function (b) {
        return "<li>" + V(b) + "</li>";
      }).join("") + '</ul><p class="art-lbl" style="margin-top:1.2rem;color:#9fb3c8">' + ATM.T("fi.b2bn") +
      '</p><ul class="s-list">' + F.b2b.reg.map(function (r) {
        return "<li>" + V(r) + "</li>";
      }).join("") + "</ul></div></div>", "2.5rem"));

    var clip = F.clip ? ('<figure class="fig" style="margin-bottom:1.4rem">' +
      '<video src="' + d + F.clip.file + '" controls muted loop playsinline preload="metadata" ' +
      'controlsList="nodownload noremoteplayback" disablepictureinpicture ' +
      'aria-label="' + esc(V(F.clip.t)) + '"></video>' +
      "<figcaption>" + badge(F.clip.v) + "<span>" + V(F.clip.t) + " — " + V(F.clip.n) +
      "</span></figcaption></figure>") : "";

    h.push(sect(head("fi.voix") + clip + '<div class="gouv" style="margin-top:1rem">' +
      F.voix.comp.map(function (c) {
        return "<div><span>" + V(c.t) + "</span>" + badge(c.v) + "</div>";
      }).join("") + '</div><ul class="s-list" style="margin-top:1rem">' +
      F.voix.reg.map(function (r) { return "<li>" + V(r) + "</li>"; }).join("") + "</ul>", "2.5rem"));

    h.push(sect(head("fi.dia") + '<div class="gouv" style="margin-top:1rem">' +
      F.diaspora.el.map(function (e) {
        return "<div><span>" + V(e.t) + "</span>" + badge(e.v) + "</div>";
      }).join("") + '</div><ul class="s-list" style="margin-top:1rem">' +
      F.diaspora.reg.map(function (r) { return "<li>" + V(r) + "</li>"; }).join("") + "</ul>", "2.5rem"));

    h.push(sect(head("fi.lic") + '<div class="gouv" style="margin-top:1rem">' +
      F.licences.map(function (l) {
        return "<div><span><b style=\"color:#fff\">" + V(l.t) + "</b><br><small>" + V(l.p) + "</small></span>" +
          badge(l.v) + "</div>";
      }).join("") + '</div><p class="art-lbl" style="margin-top:1.4rem">' + ATM.T("fi.res") +
      '</p><ul class="s-list">' + F.restrictions.map(function (r) {
        return "<li>" + V(r) + "</li>";
      }).join("") + "</ul>", "2.5rem"));

    var subj = "Atelier ATM — " + V(F.t);
    h.push(sect('<div class="verite"><p class="art-lbl" style="color:var(--amber)">' + ATM.T("fi.act") +
      '</p><div style="display:flex;gap:0.8rem;flex-wrap:wrap;margin:1rem 0">' +
      '<a class="btn btn-primary" href="' + ATM.mailto(subj + " — " + ATM.T("fi.b1"),
        "Œuvre : " + V(F.t) + "\n" + ATM.T("fi.b1") + "\n\nNom :\nCourriel :\n") + '">' + ATM.T("fi.b1") + "</a>" +
      '<a class="btn btn-outline" href="' + ATM.mailto(subj + " — " + ATM.T("fi.b2"),
        "Œuvre : " + V(F.t) + "\nGamme souhaitée :\nUsage prévu :\nVolume :\nÉchéance :\n\nOrganisation :\nContact :\n") +
      '">' + ATM.T("fi.b2") + "</a></div>" +
      '<p class="art-note" style="margin:0;max-width:80ch">' + ATM.T("fi.actn") + "</p></div>", "2.5rem"));

    document.getElementById("fiche").innerHTML = h.join("");
    document.title = V(F.t) + " — " + ATM.T("fi.k") + " | Atmart";
  }

  ATM.paint();
  fetch(ATM.ROOT + "assets/atelier/fiches/" + id.replace(/[^a-z0-9-]/gi, "") + ".json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (f) { F = f; if (!canonRedirect()) render(); })
    .catch(function () { render(); });
  ATM.onLang(function () { render(); });
  ATM.lightbox("#fiche");
})();
</script>

<script>
(function () {
  "use strict";
  Object.assign(ATM.S, {
    "pc.k": { fr: "Transparence", ht: "Transparans", en: "Transparency", es: "Transparencia" },
    "pc.h": { fr: "Notre processus de création", ht: "Kijan nou fè yon zèv", en: "Our creation process", es: "Nuestro proceso de creación" },
    "pc.p": { fr: "Une œuvre ATM+ Art n'apparaît pas toute seule. Voici les sept étapes qu'elle traverse, y compris celles où des outils numériques interviennent.", ht: "Yon zèv ATM+ Art pa parèt pou kont li. Men sèt etap li pase, ata etap kote zouti nimerik yo antre ladan.", en: "An ATM+ Art work does not appear on its own. Here are the seven stages it goes through, including those where digital tools take part.", es: "Una obra de ATM+ Art no aparece sola. Estas son las siete etapas que atraviesa, incluidas aquellas en las que intervienen herramientas digitales." },

    "pc.pol_k": { fr: "Notre position", ht: "Pozisyon nou", en: "Our position", es: "Nuestra posición" },
    "pc.pol": {
      fr: "Chaque œuvre ATM+ Art repose sur une direction artistique humaine documentée. Des outils numériques, y compris des outils d'intelligence artificielle, peuvent être utilisés à certaines étapes de la création, de l'enrichissement ou de la production. L'artiste ou le directeur artistique demeure responsable du concept, des choix visuels, de la sélection finale, des transformations apportées et de la validation de l'œuvre. ATM+ Art indique avec transparence le procédé utilisé pour chaque création.",
      ht: "Chak zèv ATM+ Art chita sou yon direksyon atistik yon moun bay, epi ki dokimante. Nou ka sèvi ak zouti nimerik, menm zouti entèlijans atifisyèl, nan kèk etap nan kreyasyon an, nan anrichisman an oswa nan pwodiksyon an. Se atis la oswa direktè atistik la ki responsab konsèp la, chwa vizyèl yo, seleksyon final la, chanjman yo fè yo ak validasyon zèv la. ATM+ Art di klè ki jan chak kreyasyon fèt.",
      en: "Every ATM+ Art work rests on a documented human artistic direction. Digital tools, including artificial intelligence tools, may be used at certain stages of creation, enrichment or production. The artist or artistic director remains responsible for the concept, the visual choices, the final selection, the transformations made and the validation of the work. ATM+ Art states transparently the process used for each creation.",
      es: "Cada obra de ATM+ Art se basa en una dirección artística humana documentada. Pueden emplearse herramientas digitales, incluidas herramientas de inteligencia artificial, en ciertas etapas de la creación, el enriquecimiento o la producción. El artista o el director artístico sigue siendo responsable del concepto, las decisiones visuales, la selección final, las transformaciones realizadas y la validación de la obra. ATM+ Art indica con transparencia el proceso utilizado en cada creación."
    },

    "pc.1t": { fr: "L'idée et la direction artistique", ht: "Lide a ak direksyon atistik la", en: "The idea and the artistic direction", es: "La idea y la dirección artística" },
    "pc.1d": { fr: "Un sujet, un univers, une intention. Cette étape est humaine, toujours : elle décide de ce que l'œuvre doit dire et de ce qu'elle ne dira pas.", ht: "Yon sijè, yon mond, yon entansyon. Etap sa a se yon moun ki fè l, toujou : se la nou deside sa zèv la dwe di ak sa li p ap di.", en: "A subject, a world, an intention. This stage is human, always: it decides what the work must say and what it will not say.", es: "Un tema, un universo, una intención. Esta etapa es humana, siempre: decide qué debe decir la obra y qué no dirá." },
    "pc.2t": { fr: "La production ou la génération assistée", ht: "Pwodiksyon an oswa jenerasyon zouti ede fè a", en: "Production or assisted generation", es: "La producción o la generación asistida" },
    "pc.2d": { fr: "Peinture, photographie, dessin — ou génération visuelle encadrée par la direction artistique. L'outil exécute ; il ne décide pas.", ht: "Penti, foto, desen — oswa yon jenerasyon vizyèl direksyon atistik la ankadre. Zouti a egzekite ; se pa li ki deside.", en: "Painting, photography, drawing — or visual generation framed by the artistic direction. The tool executes; it does not decide.", es: "Pintura, fotografía, dibujo o generación visual enmarcada por la dirección artística. La herramienta ejecuta; no decide." },
    "pc.3t": { fr: "La sélection et la transformation", ht: "Chwa a ak chanjman yo", en: "Selection and transformation", es: "La selección y la transformación" },
    "pc.3d": { fr: "Sur dix propositions, une seule est retenue, puis retravaillée : cadrage, couleurs, matière, détails. C'est là que l'œuvre devient une œuvre.", ht: "Sou dis pwopozisyon, se yon sèl nou kenbe, epi nou retravay li : kadraj, koulè, matyè, ti detay. Se la zèv la vin yon zèv.", en: "Out of ten proposals, one is kept and reworked: framing, colours, matter, details. This is where the work becomes a work.", es: "De diez propuestas, se conserva una y se retrabaja: encuadre, colores, materia, detalles. Ahí la obra se vuelve obra." },
    "pc.4t": { fr: "La validation culturelle et éditoriale", ht: "Validasyon kiltirèl ak editoryal la", en: "Cultural and editorial validation", es: "La validación cultural y editorial" },
    "pc.4d": { fr: "Pas de folklore touristique, pas de visages stéréotypés, pas de symbole religieux ajouté sans accord, jamais la diaspora réduite à la nostalgie. Une œuvre qui échoue ici ne sort pas.", ht: "Pa gen foklò pou touris, pa gen figi tou fèt, pa gen senbòl relijye nou ajoute san akò, epi nou pa janm fè dyaspora a tounen senp nostalji. Yon zèv ki pa pase etap sa a p ap soti.", en: "No touristic folklore, no stereotyped faces, no religious symbol added without agreement, and never the diaspora reduced to nostalgia. A work that fails here does not ship.", es: "Sin folclore turístico, sin rostros estereotipados, sin símbolos religiosos añadidos sin acuerdo, y nunca la diáspora reducida a la nostalgia. Una obra que falla aquí no sale." },
    "pc.5t": { fr: "Les voix, les mouvements et les déclinaisons", ht: "Vwa yo, mouvman yo ak deklinezon yo", en: "Voices, movement and derivatives", es: "Voces, movimientos y declinaciones" },
    "pc.5d": { fr: "Narration en créole, français, anglais et espagnol ; clips courts ; affiches, cartes, éditions. Chaque support garde l'œuvre reconnaissable et ne lui ajoute jamais de texte à l'intérieur de l'image.", ht: "Vwa an kreyòl, fransè, anglè ak panyòl ; ti videyo ; afich, kat, edisyon. Chak sipò kite zèv la rekonesab epi li pa janm mete tèks anndan imaj la.", en: "Narration in Creole, French, English and Spanish; short clips; posters, cards, editions. Every format keeps the work recognisable and never adds text inside the image.", es: "Narración en creole, francés, inglés y español; clips cortos; carteles, tarjetas, ediciones. Cada soporte mantiene la obra reconocible y nunca añade texto dentro de la imagen." },
    "pc.6t": { fr: "La vérification des droits", ht: "Verifikasyon dwa yo", en: "Rights verification", es: "La verificación de los derechos" },
    "pc.6d": { fr: "Qui possède quoi, pour combien de temps, sur quel territoire, avec quel usage permis. Tant que ce n'est pas écrit, l'œuvre reste en préparation.", ht: "Kilès ki mèt kisa, pou konbyen tan, nan ki peyi, ak ki itilizasyon yo gen dwa fè. Toutotan sa pa ekri, zèv la rete nan preparasyon.", en: "Who owns what, for how long, in which territory, with which permitted use. Until it is written down, the work stays in preparation.", es: "Quién posee qué, por cuánto tiempo, en qué territorio y con qué uso permitido. Mientras no esté escrito, la obra sigue en preparación." },
    "pc.7t": { fr: "La publication et la commercialisation", ht: "Piblikasyon an ak vant lan", en: "Publication and commercialisation", es: "La publicación y la comercialización" },
    "pc.7d": { fr: "La fiche paraît avec ses statuts réels. Rien n'est annoncé comme disponible, testé ou tarifé tant que ce n'est pas vrai — et le procédé de création est indiqué sur chaque fiche.", ht: "Fich la parèt ak vrè estati li yo. Nou pa anonse anyen kòm disponib, teste oswa tarife toutotan se pa vre — epi nou di sou chak fich kijan zèv la fèt.", en: "The sheet is published with its real statuses. Nothing is announced as available, tested or priced until it is true — and the creation process is stated on every sheet.", es: "La ficha se publica con sus estados reales. Nada se anuncia como disponible, probado o tarifado mientras no sea cierto, y el proceso de creación consta en cada ficha." },

    "pc.q_k": { fr: "Questions directes", ht: "Kesyon dirèk", en: "Direct questions", es: "Preguntas directas" },
    "pc.q_h": { fr: "Ce que vous êtes en droit de demander", ht: "Sa ou gen dwa mande", en: "What you are entitled to ask", es: "Lo que tiene derecho a preguntar" },
    "pc.q1": { fr: "Une œuvre générée par IA est-elle encore une œuvre ?", ht: "Èske yon zèv IA ede fè se yon zèv toujou ?", en: "Is an AI-assisted work still a work?", es: "¿Una obra asistida por IA sigue siendo una obra?" },
    "pc.a1": { fr: "L'outil ne remplace ni le regard, ni le choix, ni la responsabilité. Ce qui fait l'œuvre, c'est la direction, la sélection et la transformation — et elles restent humaines. Nous ne prétendons jamais l'inverse.", ht: "Zouti a pa ranplase ni je moun nan, ni chwa li, ni responsablite li. Sa ki fè zèv la se direksyon an, chwa a ak chanjman yo — epi se moun ki fè yo. Nou pa janm di lekontrè.", en: "The tool replaces neither the eye, nor the choice, nor the responsibility. What makes the work is the direction, the selection and the transformation — and those stay human. We never claim otherwise.", es: "La herramienta no sustituye la mirada, ni la elección, ni la responsabilidad. Lo que hace la obra es la dirección, la selección y la transformación, y siguen siendo humanas. Nunca afirmamos lo contrario." },
    "pc.q2": { fr: "Comment savoir ce qui a servi pour une œuvre donnée ?", ht: "Kijan pou m konnen ki sa yo sèvi pou yon zèv ?", en: "How do I know what was used for a given work?", es: "¿Cómo saber qué se usó en una obra?" },
    "pc.a2": { fr: "Chaque fiche d'œuvre porte un bloc « Procédé de création » : direction artistique, conception, outils, intervention humaine, source visuelle, dates, droits et statut de commercialisation.", ht: "Chak fich zèv gen yon blòk « Kijan zèv la fèt » : direksyon atistik, konsepsyon, zouti, sa moun nan fè, sous vizyèl la, dat yo, dwa yo ak estati vant lan.", en: "Every artwork sheet carries a \"Creation process\" block: artistic direction, conception, tools, human intervention, visual source, dates, rights and commercialisation status.", es: "Cada ficha lleva un bloque «Proceso de creación»: dirección artística, concepción, herramientas, intervención humana, fuente visual, fechas, derechos y estado de comercialización." },
    "pc.q3": { fr: "Et pour les artistes qui rejoignent le programme ?", ht: "E pou atis k ap vin jwenn pwogram nan ?", en: "And for artists joining the programme?", es: "¿Y para los artistas que se unen al programa?" },
    "pc.a3": { fr: "La même règle : les outils sont permis, la direction artistique humaine doit être documentée, et le procédé est déclaré. Personne ne signe une œuvre dont il n'a pas dirigé les choix.", ht: "Menm règ la : zouti yo pèmi, direksyon atistik la dwe dokimante, epi nou deklare kijan zèv la fèt. Pesonn pa siyen yon zèv li pa t dirije chwa yo.", en: "The same rule: tools are allowed, the human artistic direction must be documented, and the process is declared. Nobody signs a work whose choices they did not direct.", es: "La misma regla: las herramientas se permiten, la dirección artística humana debe documentarse y el proceso se declara. Nadie firma una obra cuyas decisiones no dirigió." },

    "pc.cta_h": { fr: "Voir comment cela s'applique", ht: "Gade kijan sa aplike", en: "See how it applies", es: "Vea cómo se aplica" },
    "pc.cta_p": { fr: "Chaque fiche d'œuvre publie son procédé et ses statuts réels. La collection montre l'ensemble : univers, gammes, supports, licences.", ht: "Chak fich zèv pibliye kijan li fèt ak vrè estati li yo. Koleksyon an montre tout bagay : mond, gam, sipò, lisans.", en: "Every artwork sheet publishes its process and its real statuses. The collection shows the whole: universes, ranges, formats, licences.", es: "Cada ficha publica su proceso y sus estados reales. La colección muestra el conjunto: universos, gamas, soportes, licencias." },
    "pc.cta_b": { fr: "La collection", ht: "Koleksyon an", en: "The collection", es: "La colección" },
    "nv.col": { fr: "La collection", ht: "Koleksyon an", en: "The collection", es: "La colección" }
  });

  function fill() {
    document.getElementById("etapes").innerHTML = [1, 2, 3, 4, 5, 6, 7].map(function (n) {
      return '<div class="etape"><span class="n">' + n + "</span><div><b>" +
        ATM.T("pc." + n + "t") + "</b><p>" + ATM.T("pc." + n + "d") + "</p></div></div>";
    }).join("");
    document.getElementById("faq").innerHTML = [1, 2, 3].map(function (n) {
      return '<p style="color:#fff;font-weight:600;margin-bottom:0.2rem">' + ATM.T("pc.q" + n) +
        '</p><p class="art-note" style="margin-bottom:1.1rem">' + ATM.T("pc.a" + n) + "</p>";
    }).join("");
  }

  ATM.paint();
  fill();
  ATM.onLang(fill);
})();
</script>
